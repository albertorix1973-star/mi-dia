name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar la app
        run: |
          DIR=$(dirname "$(find . -name settings.gradle.kts -not -path '*/.git/*' | head -1)")
          cd "$DIR"
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/MiDia.apk"

      - name: Publicar APK para descargar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Mi Día v${{ github.run_number }}
          body: Descarga MiDia.apk desde el móvil e instálalo.
          files: MiDia.apk
          make_latest: true
